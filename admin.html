<main class="page">
<h1 style="color: red; text-align: center;">
  ADMIN TEST

<!-- =========================
     管理者ログイン
========================= -->

<section class="admin-login">

  <p class="box-label">
    ADMIN
  </p>


  <h1>
    管理者ログイン
  </h1>


  <p class="admin-description">
    質問箱を確認するにはログインしてください。
  </p>


  <form id="loginForm"
        class="admin-form">


    <input
      type="email"
      id="loginEmail"
      placeholder="メールアドレス"
      autocomplete="email"
      required
    >


    <input
      type="password"
      id="loginPassword"
      placeholder="パスワード"
      autocomplete="current-password"
      required
    >


    <button
      type="submit"
      id="loginButton"
    >
      ログイン
    </button>


  </form>


  <p
    id="loginMessage"
    class="login-message"
  ></p>


</section>


</main>
